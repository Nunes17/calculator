<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
       <title> MY FIRST CALCULATOR</title>
  <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .calculator h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #aaa;
        }

        #resultado {
            width: 100%;
            height: 50px;
            background-color: #2b2b2b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.8rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            outline: none;
        }

        table {
            width: 100%;
        }

        button {
            width: 100%;
            height: 50px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
  
</head>
  <body>
  
<div class="calculator">
  <h1>my calculator</h1>
<!-- Visor da calculadora --!>  
        <input type="text" id="resultado" readonly>
        <table>
            <tr>
                <td><button>C</button></td>
                <td><button>&lt;</button></td>
                <td><button>/</button></td>
                <td><button>*</button></td>
            </tr>
            <tr>
                <td><button>7</button></td>
                <td><button>8</button></td>
                <td><button>9</button></td>
                <td><button>-</button></td>
            </tr>
            <tr>
                <td><button>4</button></td>
                <td><button>5</button></td>
                <td><button>6</button></td>
                <td><button>+</button></td>
            </tr>
            <tr>
                <td><button>1</button></td>
                <td><button>2</button></td>
                <td><button>3</button></td>
                <td rowspan="2"><button>=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button>0</button></td>
                <td><button>.</button></td>
            </tr>
        </table>

    </div>

</body>
</html>
