<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
       <title> MY FIRST CALCULATOR</title>
  <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .calculator h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #aaa;
        }

        #resultado {
            width: 100%;
            height: 50px;
            background-color: #2b2b2b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.8rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            outline: none;
        }

        table {
            width: 100%;
        }

        button {
            width: 100%;
            height: 50px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
  
</head>
  <body>
  
<div class="calculator">
  <h1>Nunes Calculator</h1>
<!-- Visor da calculadora --!>  
        <input type="text" id="resultado" readonly>
       <!-- Botões da Calculadora -->
        <table>
            <tr>
                <td><button onclick="clean()">C</button></td>
                <td><button onclick="back()">&lt;</button></td>
                <td><button onclick="insert('/')">/</button></td>
                <td><button onclick="insert('*')">*</button></td>
            </tr>
            <tr>
                <td><button onclick="insert('7')">7</button></td>
                <td><button onclick="insert('8')">8</button></td>
                <td><button onclick="insert('9')">9</button></td>
                <td><button onclick="insert('-')">-</button></td>
            </tr>
            <tr>
                <td><button onclick="insert('4')">4</button></td>
                <td><button onclick="insert('5')">5</button></td>
                <td><button onclick="insert('6')">6</button></td>
                <td><button onclick="insert('+')">+</button></td>
            </tr>
            <tr>
                <td><button onclick="insert('1')">1</button></td>
                <td><button onclick="insert('2')">2</button></td>
                <td><button onclick="insert('3')">3</button></td>
                <td rowspan="2"><button onclick="calcular()">=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button onclick="insert('0')">0</button></td>
                <td><button onclick="insert('.')">.</button></td>
            </tr>
        </table>

    </div>

    <!-- Script JavaScript para dar ação aos botões -->
    <script>
        function insert(num) {
            let visor = document.getElementById('resultado');
            visor.value += num;
        }

        function clean() {
            document.getElementById('resultado').value = "";
        }

        function back() {
            let visor = document.getElementById('resultado');
            visor.value = visor.value.substring(0, visor.value.length - 1);
        }

        function calcular() {
            let visor = document.getElementById('resultado');
            if (visor.value) {
                try {
                    visor.value = eval(visor.value);
                } catch {
                    visor.value = "Erro";
                }
            }
        }
    </script>
    </div>

</body>
</html>
